<!doctype html>
<!--
  Source for public/img/og-image.jpg (1200x630, the link-preview image).
  Regenerate: render this page at 1200x630 and save as JPG (see docs/og/README.md).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    /* field.png: the home hero's moiré field, rendered from the lab with copy and
       highlights off (see README). */
    background: #F5F4F0 url('field.png') 0 0 / 1200px 630px no-repeat;
    font-family: 'IBM Plex Mono', monospace;
    color: #111;
    position: relative;
  }
  .rule { position: absolute; left: 0; right: 0; height: 2px; background: #E6E3DC; }
  .band {
    position: absolute; left: 0; right: 0; top: 183px; height: 264px;
    background: #FFFFFF;
    display: flex; align-items: center; gap: 22px;
    padding-left: 132px;
  }
  .photo {
    width: 206px; height: 206px; border-radius: 50%;
    background: url('../../public/cv/MAF.jpg') 50% 12% / 128% no-repeat, #D9DCDB;
    flex: none;
  }
  h1 { font-weight: 700; font-size: 88px; line-height: 1; letter-spacing: -0.01em; }
  p { font-weight: 400; font-size: 42px; line-height: 1; margin-top: 22px; letter-spacing: -0.005em; }
</style>
</head>
<body>
  <div class="rule" style="top:30px"></div>
  <div class="rule" style="top:182px"></div>
  <div class="rule" style="top:446px"></div>
  <div class="rule" style="top:598px"></div>
  <div class="band">
    <div class="photo" role="img" aria-label="Miguel Angelo"></div>
    <div>
      <h1>Miguel Angelo</h1>
      <p>Intelligent Systems Designer</p>
    </div>
  </div>
</body>
</html>
