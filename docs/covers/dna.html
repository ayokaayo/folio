<!doctype html>
<!--
  Source for public/img/dna/cover-field.jpg (1600x1000 @2x).
  Concept: two glyph fields flow toward each other and interleave at the centre
  seam in accent green — "Designers ship code, engineers ship design".
  On-theme with the home hero (components/hero): cream paper, IBM Plex Mono,
  the dot-to-diamond glyph ramp, pine-green accent #338467.
  Regenerate: node docs/covers/render.mjs
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=block" rel="stylesheet">
<style>
  :root {
    --paper: #F7F5F0;
    --grid: #E8DFD0;
    --ink: #2A2A2C;
    --accent: #338467;
    --accent-dark: #24664E;
    --accent-deep: #184937;
    --faint: #D9D2C4;
    --mid: #B3A994;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 1000px; overflow: hidden; }
  body {
    position: relative;
    background:
      repeating-linear-gradient(0deg, transparent 0 39px, var(--grid) 39px 40px),
      repeating-linear-gradient(90deg, transparent 0 39px, var(--grid) 39px 40px),
      var(--paper);
    background-blend-mode: normal;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--ink);
  }
  /* soften the minor grid */
  .gridwash { position: absolute; inset: 0; background: var(--paper); opacity: 0.55; }
  #field { position: absolute; inset: 0; z-index: 1; }
  .g {
    position: absolute;
    font-size: 22px;
    line-height: 1;
    transform: translate(-50%, -50%);
    user-select: none;
  }
  /* clear the lower-left so the headline stays legible */
  .vignette {
    position: absolute; inset: 0; z-index: 2;
    background: radial-gradient(130% 115% at 14% 86%, var(--paper) 0%, rgba(247,245,240,0.92) 26%, rgba(247,245,240,0) 52%);
  }
  .corner { position: absolute; z-index: 4; width: 26px; height: 26px; border: 0 solid var(--mid); opacity: .7; }
  .tl { top: 44px; left: 44px; border-top-width: 2px; border-left-width: 2px; }
  .tr { top: 44px; right: 44px; border-top-width: 2px; border-right-width: 2px; }
  .bl { bottom: 44px; left: 44px; border-bottom-width: 2px; border-left-width: 2px; }
  .br { bottom: 44px; right: 44px; border-bottom-width: 2px; border-right-width: 2px; }
  .copy { position: absolute; z-index: 3; left: 96px; bottom: 150px; max-width: 1050px; }
  .kicker {
    font-size: 20px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--accent-dark); margin-bottom: 26px;
  }
  .kicker .dot { color: var(--accent); }
  h1 {
    font-weight: 500; font-size: 68px; line-height: 1.08; letter-spacing: -0.02em; color: var(--ink);
  }
  h1 .hl { color: var(--accent-deep); font-weight: 600; }
  .meta {
    position: absolute; z-index: 3; left: 96px; bottom: 96px;
    font-size: 17px; letter-spacing: 0.04em; color: var(--mid);
  }
</style>
</head>
<body>
  <div class="gridwash"></div>
  <div id="field"></div>
  <div class="vignette"></div>
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div class="copy">
    <div class="kicker">DNA <span class="dot">·</span> Design system workstation</div>
    <h1>Designers ship <span class="hl">code</span>,<br>engineers ship <span class="hl">design</span></h1>
  </div>
  <div class="meta">anyone with an idea, into production code</div>

<script>
  // deterministic field so re-renders are stable
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  const rnd = mulberry32(20260202);
  const ramp = ['·','·',':','+','×','◇','┼','╬']; // hero dot→diamond ramp
  const W = 1600, H = 1000, step = 30;
  const field = document.getElementById('field');
  const cx = W/2;
  const sigma = W*0.145;
  const frag = document.createDocumentFragment();
  for (let y = step*0.6; y < H; y += step) {
    const rowShift = ((Math.floor(y/step) % 2) ? step/2 : 0); // interleave the weave
    for (let x = step*0.6 + rowShift; x < W; x += step) {
      const dx = Math.abs(x - cx);
      // seam intensity: bright at the centre, fading out to the sides
      let t = Math.exp(-(dx*dx)/(2*sigma*sigma));
      t *= 0.82 + 0.18*rnd();               // a little grain
      // gentle vertical taper so top/bottom are a touch quieter
      t *= 0.86 + 0.14*Math.sin((y/H)*Math.PI);
      const lvl = Math.max(0, Math.min(ramp.length-1, Math.round(t*(ramp.length-1))));
      const el = document.createElement('span');
      el.className = 'g';
      el.textContent = ramp[lvl];
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      el.style.fontSize = (16 + t*14) + 'px';
      if (t > 0.55) {                        // the overlapping seam, lit green
        const k = (t-0.55)/0.45;
        el.style.color = k > 0.6 ? '#184937' : '#338467';
        el.style.fontWeight = '600';
        el.style.opacity = (0.75 + 0.25*k).toFixed(2);
      } else if (t > 0.28) {
        el.style.color = '#B3A994';
        el.style.opacity = '0.9';
      } else {
        el.style.color = '#D9D2C4';
        el.style.opacity = '0.9';
      }
      frag.appendChild(el);
    }
  }
  field.appendChild(frag);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => { window.__ready = true; });
  } else { window.__ready = true; }
</script>
</body>
</html>
