<!doctype html>
<!--
  Source for public/img/nexus/cover-drift.jpg (1600x1000 @2x).
  Concept: a dark field of faint mono glyphs, with ~3% lit in accent green —
  the headline stat "Only 3% of styles followed the system" as the image.
  On-theme with the home hero (components/hero): IBM Plex Mono, the dot-to-diamond
  glyph ramp, pine-green accent. Dark treatment (the paired dark cover to DNA's light).
  Regenerate: node docs/covers/render.mjs
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=block" rel="stylesheet">
<style>
  :root {
    --ground: #16171B;
    --grid: #22242B;
    --dim: #3A3C44;
    --dim2: #2C2E35;
    --ink: #ECEAE4;
    --accent: #54AB8B;
    --accent-bright: #6FC9A5;
    --accent-dark: #338467;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 1000px; overflow: hidden; }
  body {
    position: relative;
    background:
      repeating-linear-gradient(0deg, transparent 0 39px, var(--grid) 39px 40px),
      repeating-linear-gradient(90deg, transparent 0 39px, var(--grid) 39px 40px),
      var(--ground);
    font-family: 'IBM Plex Mono', monospace;
    color: var(--ink);
  }
  .gridwash { position: absolute; inset: 0; background: var(--ground); opacity: 0.5; }
  #field { position: absolute; inset: 0; z-index: 1; }
  .g { position: absolute; line-height: 1; transform: translate(-50%, -50%); user-select: none; }
  .g.lit { color: var(--accent); text-shadow: 0 0 10px rgba(84,171,139,0.55), 0 0 22px rgba(84,171,139,0.28); font-weight: 600; }
  .vignette {
    position: absolute; inset: 0; z-index: 2;
    background:
      radial-gradient(135% 120% at 12% 88%, rgba(22,23,27,0.96) 0%, rgba(22,23,27,0.82) 28%, rgba(22,23,27,0) 55%),
      radial-gradient(100% 100% at 50% 50%, rgba(22,23,27,0) 60%, rgba(22,23,27,0.55) 100%);
  }
  .corner { position: absolute; z-index: 4; width: 26px; height: 26px; border: 0 solid #4A4D56; opacity: .8; }
  .tl { top: 44px; left: 44px; border-top-width: 2px; border-left-width: 2px; }
  .tr { top: 44px; right: 44px; border-top-width: 2px; border-right-width: 2px; }
  .bl { bottom: 44px; left: 44px; border-bottom-width: 2px; border-left-width: 2px; }
  .br { bottom: 44px; right: 44px; border-bottom-width: 2px; border-right-width: 2px; }
  .legend {
    position: absolute; z-index: 3; top: 60px; right: 72px; text-align: right;
    font-size: 16px; letter-spacing: 0.04em; color: #8A8C94; line-height: 1.9;
  }
  .legend .sw { display: inline-block; width: 9px; height: 9px; margin-left: 10px; transform: translateY(0); }
  .legend .on { background: var(--accent); box-shadow: 0 0 8px rgba(84,171,139,0.7); }
  .legend .off { background: var(--dim); }
  .legend b { color: var(--accent-bright); font-weight: 600; }
  .copy { position: absolute; z-index: 3; left: 96px; bottom: 150px; max-width: 1080px; }
  .kicker {
    font-size: 20px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 26px;
  }
  .kicker .dot { color: var(--accent-bright); }
  h1 { font-weight: 500; font-size: 68px; line-height: 1.08; letter-spacing: -0.02em; color: var(--ink); }
  h1 .hl { color: var(--accent-bright); font-weight: 600; }
  .meta {
    position: absolute; z-index: 3; left: 96px; bottom: 96px;
    font-size: 17px; letter-spacing: 0.04em; color: #7D7F88;
  }
</style>
</head>
<body>
  <div class="gridwash"></div>
  <div id="field"></div>
  <div class="vignette"></div>
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div class="legend">
    on the system <span class="sw on"></span><br>
    drift <span class="sw off"></span>
  </div>

  <div class="copy">
    <div class="kicker">Nexus <span class="dot">·</span> Design debt remediation</div>
    <h1>Only <span class="hl">3%</span> of styles<br>followed the system</h1>
  </div>
  <div class="meta">22,050 style rules, measured</div>

<script>
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  const rnd = mulberry32(90325);
  const dimRamp = ['.','·','·',':'];                 // quiet drift glyphs
  const litRamp = ['◇','┼','╬','×'];                 // heavy marks for the on-system few
  const W = 1600, H = 1000, step = 29;
  const field = document.getElementById('field');
  const frag = document.createDocumentFragment();
  for (let y = step*0.6; y < H; y += step) {
    const rowShift = ((Math.floor(y/step) % 2) ? step/2 : 0);
    for (let x = step*0.6 + rowShift; x < W; x += step) {
      const lit = rnd() < 0.03;                       // ~3% on the system
      const el = document.createElement('span');
      el.className = 'g' + (lit ? ' lit' : '');
      if (lit) {
        el.textContent = litRamp[(Math.floor(rnd()*litRamp.length))];
        el.style.fontSize = (22 + rnd()*8) + 'px';
      } else {
        el.textContent = dimRamp[(Math.floor(rnd()*dimRamp.length))];
        el.style.fontSize = (15 + rnd()*5) + 'px';
        el.style.color = rnd() < 0.5 ? '#3A3C44' : '#2C2E35';
      }
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      frag.appendChild(el);
    }
  }
  field.appendChild(frag);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => { window.__ready = true; });
  } else { window.__ready = true; }
</script>
</body>
</html>
