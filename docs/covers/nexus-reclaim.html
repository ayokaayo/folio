<!doctype html>
<!--
  Positive reframe of the Nexus cover: a reclamation sweep. The glyph field runs
  from grey drift on the left to dense, glowing pine-green "on system" on the right —
  the design system winning its product back.
  Renders to public/img/nexus/cover-reclaim.jpg
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=block" rel="stylesheet">
<style>
  :root {
    --ground: #16171B;
    --grid: #22242B;
    --ink: #ECEAE4;
    --accent: #54AB8B;
    --accent-bright: #6FC9A5;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 1000px; overflow: hidden; }
  body {
    position: relative;
    background:
      repeating-linear-gradient(0deg, transparent 0 39px, var(--grid) 39px 40px),
      repeating-linear-gradient(90deg, transparent 0 39px, var(--grid) 39px 40px),
      var(--ground);
    font-family: 'IBM Plex Mono', monospace;
    color: var(--ink);
  }
  .gridwash { position: absolute; inset: 0; background: var(--ground); opacity: 0.5; }
  #field { position: absolute; inset: 0; z-index: 1; }
  .g { position: absolute; line-height: 1; transform: translate(-50%, -50%); user-select: none; }
  .g.lit { color: var(--accent); text-shadow: 0 0 10px rgba(84,171,139,0.55), 0 0 22px rgba(84,171,139,0.28); font-weight: 600; }
  .vignette {
    position: absolute; inset: 0; z-index: 2;
    background:
      radial-gradient(135% 125% at 10% 90%, rgba(22,23,27,0.97) 0%, rgba(22,23,27,0.88) 26%, rgba(22,23,27,0) 54%),
      linear-gradient(90deg, rgba(22,23,27,0.35) 0%, rgba(22,23,27,0) 30%);
  }
  .corner { position: absolute; z-index: 4; width: 26px; height: 26px; border: 0 solid #4A4D56; opacity: .8; }
  .tl { top: 44px; left: 44px; border-top-width: 2px; border-left-width: 2px; }
  .tr { top: 44px; right: 44px; border-top-width: 2px; border-right-width: 2px; }
  .bl { bottom: 44px; left: 44px; border-bottom-width: 2px; border-left-width: 2px; }
  .br { bottom: 44px; right: 44px; border-bottom-width: 2px; border-right-width: 2px; }
  .axis {
    position: absolute; z-index: 3; top: 56px; left: 96px; right: 96px;
    display: flex; justify-content: space-between;
    font-size: 15px; letter-spacing: 0.18em; text-transform: uppercase; color: #8A8C94;
  }
  .axis span {
    background: rgba(16,17,21,0.82);
    padding: 7px 12px;
    border: 1px solid rgba(74,77,86,0.4);
  }
  .axis .on { color: var(--accent-bright); border-color: rgba(84,171,139,0.45); }
  .copy { position: absolute; z-index: 3; left: 96px; bottom: 150px; max-width: 1080px; }
  .kicker {
    font-size: 20px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 26px;
  }
  .kicker .dot { color: var(--accent-bright); }
  h1 { font-weight: 500; font-size: 64px; line-height: 1.1; letter-spacing: -0.02em; color: var(--ink); }
  h1 .hl { color: var(--accent-bright); font-weight: 600; }
  .meta { position: absolute; z-index: 3; left: 96px; bottom: 96px; font-size: 17px; letter-spacing: 0.04em; color: #7D7F88; }
</style>
</head>
<body>
  <div class="gridwash"></div>
  <div id="field"></div>
  <div class="vignette"></div>
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div class="axis"><span>drift</span><span class="on">on the system</span></div>

  <div class="copy">
    <div class="kicker">Nexus <span class="dot">·</span> Design debt remediation</div>
    <h1>The design system<br><span class="hl">won</span> its product back</h1>
  </div>
  <div class="meta">22,050 style rules, reclaimed</div>

<script>
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  const rnd = mulberry32(77214);
  const dimRamp = ['.','·','·',':'];
  const litRamp = ['◇','┼','╬','+','×'];
  const W = 1600, H = 1000, step = 29;
  const field = document.getElementById('field');
  const frag = document.createDocumentFragment();
  function smooth(e0,e1,x){ const t=Math.max(0,Math.min(1,(x-e0)/(e1-e0))); return t*t*(3-2*t); }
  for (let y = step*0.6; y < H; y += step) {
    const rowShift = ((Math.floor(y/step) % 2) ? step/2 : 0);
    for (let x = step*0.6 + rowShift; x < W; x += step) {
      const r = x / W;
      // reclamation sweep: green probability climbs left -> right
      const pGreen = smooth(0.14, 0.92, r);
      const lit = rnd() < pGreen;
      const el = document.createElement('span');
      el.className = 'g' + (lit ? ' lit' : '');
      if (lit) {
        el.textContent = litRamp[(Math.floor(rnd()*litRamp.length))];
        el.style.fontSize = (20 + rnd()*9) + 'px';
        if (rnd() > 0.7) el.style.color = '#6FC9A5';
      } else {
        el.textContent = dimRamp[(Math.floor(rnd()*dimRamp.length))];
        el.style.fontSize = (15 + rnd()*5) + 'px';
        el.style.color = rnd() < 0.5 ? '#3A3C44' : '#2C2E35';
      }
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      frag.appendChild(el);
    }
  }
  field.appendChild(frag);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => { window.__ready = true; });
  } else { window.__ready = true; }
</script>
</body>
</html>
