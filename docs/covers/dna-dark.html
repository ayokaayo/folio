<!doctype html>
<!--
  Dark variant of the DNA cover, for comparison against cover-field.jpg (light).
  Same converging-seam concept, on the dark treatment paired with Nexus.
  Renders to public/img/dna/cover-field-dark.jpg
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=block" rel="stylesheet">
<style>
  :root {
    --ground: #16171B;
    --grid: #22242B;
    --ink: #ECEAE4;
    --accent: #54AB8B;
    --accent-bright: #6FC9A5;
    --accent-dark: #338467;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 1000px; overflow: hidden; }
  body {
    position: relative;
    background:
      repeating-linear-gradient(0deg, transparent 0 39px, var(--grid) 39px 40px),
      repeating-linear-gradient(90deg, transparent 0 39px, var(--grid) 39px 40px),
      var(--ground);
    font-family: 'IBM Plex Mono', monospace;
    color: var(--ink);
  }
  .gridwash { position: absolute; inset: 0; background: var(--ground); opacity: 0.5; }
  #field { position: absolute; inset: 0; z-index: 1; }
  .g { position: absolute; font-size: 22px; line-height: 1; transform: translate(-50%, -50%); user-select: none; }
  .vignette {
    position: absolute; inset: 0; z-index: 2;
    background: radial-gradient(130% 115% at 14% 86%, rgba(22,23,27,0.97) 0%, rgba(22,23,27,0.86) 26%, rgba(22,23,27,0) 54%);
  }
  .corner { position: absolute; z-index: 4; width: 26px; height: 26px; border: 0 solid #4A4D56; opacity: .8; }
  .tl { top: 44px; left: 44px; border-top-width: 2px; border-left-width: 2px; }
  .tr { top: 44px; right: 44px; border-top-width: 2px; border-right-width: 2px; }
  .bl { bottom: 44px; left: 44px; border-bottom-width: 2px; border-left-width: 2px; }
  .br { bottom: 44px; right: 44px; border-bottom-width: 2px; border-right-width: 2px; }
  .copy { position: absolute; z-index: 3; left: 96px; bottom: 150px; max-width: 1050px; }
  .kicker {
    font-size: 20px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 26px;
  }
  .kicker .dot { color: var(--accent-bright); }
  h1 { font-weight: 500; font-size: 68px; line-height: 1.08; letter-spacing: -0.02em; color: var(--ink); }
  h1 .hl { color: var(--accent-bright); font-weight: 600; }
  .meta { position: absolute; z-index: 3; left: 96px; bottom: 96px; font-size: 17px; letter-spacing: 0.04em; color: #7D7F88; }
</style>
</head>
<body>
  <div class="gridwash"></div>
  <div id="field"></div>
  <div class="vignette"></div>
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div class="copy">
    <div class="kicker">DNA <span class="dot">·</span> Design system workstation</div>
    <h1>Designers ship <span class="hl">code</span>,<br>engineers ship <span class="hl">design</span></h1>
  </div>
  <div class="meta">anyone with an idea, into production code</div>

<script>
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  const rnd = mulberry32(20260202);
  const ramp = ['·','·',':','+','×','◇','┼','╬'];
  const W = 1600, H = 1000, step = 30;
  const field = document.getElementById('field');
  const cx = W/2;
  const sigma = W*0.145;
  const frag = document.createDocumentFragment();
  for (let y = step*0.6; y < H; y += step) {
    const rowShift = ((Math.floor(y/step) % 2) ? step/2 : 0);
    for (let x = step*0.6 + rowShift; x < W; x += step) {
      const dx = Math.abs(x - cx);
      let t = Math.exp(-(dx*dx)/(2*sigma*sigma));
      t *= 0.82 + 0.18*rnd();
      t *= 0.86 + 0.14*Math.sin((y/H)*Math.PI);
      const lvl = Math.max(0, Math.min(ramp.length-1, Math.round(t*(ramp.length-1))));
      const el = document.createElement('span');
      el.className = 'g';
      el.textContent = ramp[lvl];
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      el.style.fontSize = (16 + t*14) + 'px';
      if (t > 0.55) {                         // the seam, lit green with glow
        const k = (t-0.55)/0.45;
        el.style.color = k > 0.6 ? '#6FC9A5' : '#54AB8B';
        el.style.fontWeight = '600';
        el.style.textShadow = '0 0 10px rgba(84,171,139,' + (0.3 + 0.4*k).toFixed(2) + '), 0 0 22px rgba(84,171,139,0.25)';
        el.style.opacity = (0.8 + 0.2*k).toFixed(2);
      } else if (t > 0.28) {
        el.style.color = '#3D4048';
        el.style.opacity = '0.95';
      } else {
        el.style.color = '#2C2E35';
        el.style.opacity = '0.95';
      }
      frag.appendChild(el);
    }
  }
  field.appendChild(frag);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => { window.__ready = true; });
  } else { window.__ready = true; }
</script>
</body>
</html>
